name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache fetched dependencies (JUCE, Catch2)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Unit tests (DSP engine)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: pluginval (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --skip-gui-tests --validate-in-process \
            --validate "build/plugin/Polisher_artefacts/Release/VST3/Polisher.vst3"

      - name: Audio Unit validation (auval)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/plugin/Polisher_artefacts/Release/AU/Polisher.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Pls1 Plsh

      - name: pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          .\pluginval\pluginval.exe --strictness-level 5 --skip-gui-tests --validate-in-process --validate "build\plugin\Polisher_artefacts\Release\VST3\Polisher.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload plug-ins
        uses: actions/upload-artifact@v4
        with:
          name: Polisher-${{ matrix.name }}
          path: |
            build/plugin/Polisher_artefacts/Release/VST3
            build/plugin/Polisher_artefacts/Release/AU
            build/plugin/Polisher_artefacts/Release/Standalone
          if-no-files-found: warn
