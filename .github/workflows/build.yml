name: Build & Test

# Every push builds Windows only (the repo is private: macOS minutes count 10x against the free
# 2,000 a month). For a Mac build: Actions -> Build & Test -> Run workflow, tick "Also build macOS".
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mac:
        description: "Also build macOS (VST3 / AU / Standalone)"
        type: boolean
        default: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.mac
          && '[{"name":"macOS","os":"macos-14"},{"name":"Windows","os":"windows-latest"}]'
          || '[{"name":"Windows","os":"windows-latest"}]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache fetched dependencies (JUCE, Catch2)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

      - name: Fetch WebView2 SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "1.0.3485.44"
          $root = ("$env:RUNNER_TEMP/nuget") -replace '\\','/'
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$v" -OutFile webview2.zip
          Expand-Archive webview2.zip -DestinationPath "$root/Microsoft.Web.WebView2.$v"
          "WEBVIEW2_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ runner.os == 'Windows' && format('-DJUCE_WEBVIEW2_PACKAGE_LOCATION={0}', env.WEBVIEW2_DIR) || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # Engine tests plus the plug-in-level tests (block sizes, offline vs real time, latency at every
      # sample rate, no audio-thread allocation, saved state, automation torture).
      - name: Unit tests (engine + plug-in)
        run: ctest --test-dir build -C Release --output-on-failure

      # The blind-test tool goes next to the plug-in folders, so the artifact keeps VST3 / Standalone at
      # its top level (upload-artifact roots a multi-path upload at the paths' common folder).
      - name: Stage the blind-test tool
        shell: bash
        run: |
          mkdir -p build/plugin/Polisher_artefacts/Release/BlindTest
          cp build/tools/blindtest/MasterologyBlindTest_artefacts/Release/MasterologyBlindTest* build/plugin/Polisher_artefacts/Release/BlindTest/

      - name: Upload plug-ins
        uses: actions/upload-artifact@v4
        with:
          name: Masterology-${{ matrix.name }}
          path: |
            build/plugin/Polisher_artefacts/Release/VST3
            build/plugin/Polisher_artefacts/Release/AU
            build/plugin/Polisher_artefacts/Release/Standalone
            build/plugin/Polisher_artefacts/Release/BlindTest
          if-no-files-found: warn

      - name: pluginval (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --timeout-ms 1800000 --skip-gui-tests --validate-in-process \
            --validate "build/plugin/Polisher_artefacts/Release/VST3/Masterology.vst3"

      - name: Audio Unit validation (auval)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/plugin/Polisher_artefacts/Release/AU/Masterology.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Pls1 Plsh

      # Steinberg's own VST3 validator, built from the VST3 SDK (cached by SDK commit); pluginval runs it
      # as part of its checks.
      - name: Find VST3 SDK version (Windows)
        if: runner.os == 'Windows'
        id: vst3sdk
        shell: bash
        run: echo "sha=$(git ls-remote https://github.com/steinbergmedia/vst3sdk.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache VST3 validator (Windows)
        if: runner.os == 'Windows'
        id: validator-cache
        uses: actions/cache@v4
        with:
          path: vst3validator
          key: vst3validator-${{ runner.os }}-${{ steps.vst3sdk.outputs.sha }}

      - name: Build VST3 validator (Windows)
        if: runner.os == 'Windows' && steps.validator-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --quiet --depth 1 --recursive --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git "$RUNNER_TEMP/vst3sdk"
          cmake -S "$RUNNER_TEMP/vst3sdk" -B "$RUNNER_TEMP/vst3build" -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF \
            -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=ON
          cmake --build "$RUNNER_TEMP/vst3build" --config Release --target validator --parallel 4
          mkdir -p vst3validator
          cp "$(find "$RUNNER_TEMP/vst3build" -name validator.exe | head -1)" vst3validator/

      # Strictness 10 = pluginval's maximum: every sample rate and block size, randomised parameter
      # changes and automation, state save / restore, bus layouts, plus Steinberg's validator. GUI tests
      # are skipped (the runner has no display / WebView2 runtime for the editor). Logs are uploaded.
      - name: pluginval, strictness 10 + VST3 validator (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          New-Item -ItemType Directory -Force pluginval-logs | Out-Null
          # pluginval.exe is a GUI-subsystem program: PowerShell neither waits for it nor sees its exit code
          # unless it is started with -Wait -PassThru (without this a failure showed as a green run).
          $args = @("--strictness-level", "10", "--skip-gui-tests", "--validate-in-process", "--timeout-ms", "1800000",
                    "--vst3validator", "`"$PWD\vst3validator\validator.exe`"", "--output-dir", "`"$PWD\pluginval-logs`"",
                    "--validate", "`"$PWD\build\plugin\Polisher_artefacts\Release\VST3\Masterology.vst3`"")
          $p = Start-Process -FilePath ".\pluginval\pluginval.exe" -ArgumentList $args -Wait -PassThru -NoNewWindow
          Get-ChildItem pluginval-logs -Filter *.txt | ForEach-Object { Get-Content $_.FullName | Select-String -Pattern "failed|FAILED|ERROR|Result:" }
          Write-Host "pluginval exit code: $($p.ExitCode)"
          exit $p.ExitCode

      - name: Upload validation logs
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Validation-logs-${{ matrix.name }}
          path: pluginval-logs
          if-no-files-found: ignore

  # The engine tests under AddressSanitizer + UndefinedBehaviorSanitizer: out-of-bounds reads and writes,
  # use after free, leaks, overflow and other undefined behaviour fail the run.
  # ~20 Linux minutes, so not on every push (private-repo minutes): pull requests and manual runs only.
  sanitizers:
    name: Engine tests (ASan + UBSan)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPOLISHER_BUILD_PLUGIN=OFF
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel 4
      - name: Run
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ./build/tests/polisher_tests

  # The web UI in headless Chromium (mock.js stands in for the plug-in): every module's switch, A / B,
  # host changes, no script errors.
  ui:
    name: UI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch JUCE's web-view bridge (same JUCE tag as CMakeLists.txt)
        run: |
          mkdir -p plugin/ui/juce
          for f in index.js check_native_interop.js; do
            curl -fsSL -o "plugin/ui/juce/$f" "https://raw.githubusercontent.com/juce-framework/JUCE/8.0.15/modules/juce_gui_extra/native/javascript/$f"
          done
      - name: Install Playwright
        working-directory: tests/ui
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Run
        run: |
          (cd plugin/ui && python3 -m http.server 8765 > /dev/null 2>&1 &)
          sleep 2
          node tests/ui/ui_smoke.mjs
